<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cesta de pesquisa — Licit@Gov</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
    <h1>Licit@Gov <small>Pesquisa de compras públicas no PNCP</small></h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="editais.html">Editais</a>
        <a href="atas.html">Atas de Preços</a>
        <a href="contratos.html">Contratos</a>
        <a href="cesta.html" id="link-cesta">Cesta</a>
    </nav>
</header>

<main>

    <div class="card">
        <div class="linha">
            <h2>Cesta de pesquisa</h2>
            <span class="espaco"></span>
            <span id="contador-cesta" class="mudo"></span>
            <button class="sec" id="btnLimpar">Limpar cesta</button>
            <button class="sec" id="btnExportar">Exportar CSV</button>
            <button id="btnRelatorio" disabled>Gerar relatório</button>
        </div>

        <p class="sub" style="margin-top: 6px">
            Os itens ficam guardados neste navegador. Você pode pesquisar outras
            contratações e continuar adicionando à mesma cesta.
        </p>

        <div id="aviso"></div>
        <div id="lista"></div>
    </div>

    <div class="card" id="bloco-resumo" style="display: none;">
        <h2>Resumo dos valores unitários</h2>
        <div id="resumo"></div>
    </div>

</main>

<script src="js/relatorio.js"></script>
<script src="js/relatorio-pesquisa.js"></script>
<script src="js/cesta.js"></script>
<script src="js/cesta-pagina.js"></script>

</body>
</html>
